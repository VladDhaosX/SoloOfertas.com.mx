<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Pagina no encontrada | Solo Ofertas</title>
  <link rel="icon" href="/shared/img/logo-ofertas.png" type="image/png">
  <link rel="stylesheet" href="/shared/css/base.css">
  <link rel="stylesheet" href="/shared/css/header.css">
  <link rel="stylesheet" href="/shared/css/footer.css">
  <style>
    .not-found { min-height: 45vh; display: grid; place-items: center; padding: 4rem 1rem; text-align: center; }
    .not-found-content { max-width: 620px; }
    .not-found h1 { color: #1957c4; font-size: clamp(2rem, 6vw, 4rem); margin-bottom: 1rem; }
    .not-found p { color: #4b5563; margin-bottom: 1.5rem; }
    .not-found a { display: inline-block; padding: 0.75rem 1.2rem; border-radius: 4px; color: #fff; background: #1957c4; font-weight: 700; }
  </style>
</head>
<body>
  <div id="header-placeholder"></div>
  <main class="not-found">
    <div class="not-found-content">
      <h1>Pagina no encontrada</h1>
      <p>La direccion solicitada no existe o ya no esta disponible.</p>
      <a href="/">Volver a Solo Ofertas</a>
    </div>
  </main>
  <div id="footer-placeholder"></div>
  <script src="/shared/js/components.js"></script>
</body>
</html>
